<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self';" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Gaegu:wght@400;700&display=swap" rel="stylesheet" />
<title>꼬질룡</title>
<style>
  html, body {
    margin: 0; width: 100%; height: 100%;
    background: #0c0c0d; color: #ededed; overflow: hidden;
    font-family: "Gaegu", "Nanum Pen Script", system-ui, serif;
    user-select: none;
  }
  #stage { position: absolute; inset: 0; }

  /* 공통 페이드 */
  .fade { opacity: 0; transition: opacity 1.6s ease; }
  .fade.in { opacity: 1; }
  .fade.slow { transition: opacity 2.6s ease; }

  /* 구석 작은 아이콘 [ … ] */
  #dots {
    position: absolute; left: 22px; bottom: 18px;
    font-family: "Gaegu", monospace; font-size: 20px; color: #6a6a6a;
  }
  /* 오른쪽 아래 작은 "오." */
  #oh {
    position: absolute; right: 30px; bottom: 26px; font-size: 22px; color: #cfcfcf;
    font-family: "Nanum Pen Script";
  }

  /* txt 창 */
  .txtwin {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%) rotate(-0.6deg);
    width: 460px; max-width: 80%;
    border: 1.6px solid #4a4a4a; border-radius: 8px;
    background: #141416;
  }
  .txtwin .bar {
    font-family: "Nanum Pen Script"; font-size: 18px; color: #aaa;
    padding: 5px 12px; border-bottom: 1.4px solid #3a3a3a;
  }
  .txtwin .body {
    padding: 16px 20px; font-size: 18px; line-height: 1.7; color: #e6e6e6;
    white-space: pre-wrap; min-height: 40px;
  }
  .txtwin .body .ln { opacity: 0; transition: opacity 1.2s ease; }
  .txtwin .body .ln.in { opacity: 1; }
  .sig { text-align: right; color: #9a9a9a; }

  /* 가운데 큰 한 줄 (대사/크레딧) */
  #center {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    width: 86%; text-align: center;
  }
  #center .big { font-size: 40px; line-height: 1.4; }
  #center .code {
    font-family: "Gaegu", monospace; font-size: 34px; color: #fff;
  }
  #center .sub { font-size: 24px; color: #b9b9b9; margin-top: 8px; }
  #center .tiny { font-size: 20px; color: #8f8f8f; }

  /* 대화 */
  #chat {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    width: 480px; max-width: 84%;
  }
  #chat .line { font-size: 26px; margin: 10px 0; }
  #chat .me { color: #cfcfcf; }
  #chat .ko { color: #fff; }

  /* 미니 에디터 (my_first_program) */
  #editor {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%) rotate(0.5deg);
    width: 420px; max-width: 80%;
    border: 1.6px solid #444; border-radius: 8px; background: #131316;
  }
  #editor .tab { font-family:"Nanum Pen Script"; font-size:17px; color:#bbb; padding:5px 12px; border-bottom:1.4px solid #3a3a3a; }
  #editor pre { margin:0; padding:16px 18px; font-family:"Gaegu",monospace; font-size:22px; color:#eaeaea; }

  /* 꼬질룡 (검은 선 → 흰 선으로 반전해서 검은 배경에 보이게) */
  #dino {
    position: absolute; left: 50%; bottom: 14%; transform: translateX(-50%);
    width: 120px; height: 120px;
  }
  #dino img { width:100%; height:100%; object-fit:contain; filter: invert(1) brightness(1.4); }

  .vignette { position:absolute; inset:0; box-shadow: inset 0 0 160px 40px rgba(0,0,0,.7); pointer-events:none; }
</style>
</head>
<body>
  <div id="stage">
    <div id="dots" class="fade">[ … ]</div>
    <div id="oh" class="fade">오.</div>
    <div id="dino" class="fade"><img id="dinoImg" alt="" /></div>

    <div id="txtwin" class="txtwin fade" style="display:none;">
      <div class="bar" id="txtbar">그날.txt</div>
      <div class="body" id="txtbody"></div>
    </div>

    <div id="chat" class="fade" style="display:none;"></div>

    <div id="editor" class="fade" style="display:none;">
      <div class="tab">my_first_program</div>
      <pre id="editorcode"></pre>
    </div>

    <div id="center" class="fade" style="display:none;"></div>

    <div class="vignette"></div>
  </div>
  <script src="ending.js"></script>
</body>
</html>
